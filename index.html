<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Para Melani 💕</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Parisienne&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #f7f0ea;
      color: #2b2527;
      font-family: "Cormorant Garamond", serif;
    }

    .portada {
      min-height: 100vh;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      text-align: center;
      padding: 30px;

      background:
        radial-gradient(
          circle at 15% 20%,
          rgba(211, 153, 168, 0.20),
          transparent 30%
        ),
        radial-gradient(
          circle at 85% 80%,
          rgba(170, 104, 122, 0.13),
          transparent 30%
        ),
        #f7f0ea;
    }

    h1 {
      font-family: "Parisienne", cursive;

      font-size: clamp(48px, 11vw, 82px);

      font-weight: normal;

      line-height: 1.2;

      max-width: 900px;

      color: #2b2527;
    }

    .continuar {
      margin-top: 50px;

      border: 1px solid #a96d7c;

      background: transparent;

      color: #7d4657;

      padding: 12px 30px;

      border-radius: 30px;

      font-family: "Cormorant Garamond", serif;

      font-size: 16px;

      cursor: pointer;

      transition: all 0.3s ease;
    }

    .continuar:hover {
      background: #7d4657;
      color: white;
    }

    /* Adaptación para celulares */

    @media (max-width: 600px) {

      h1 {
        font-size: 52px;
        max-width: 90%;
      }

      .continuar {
        margin-top: 45px;
      }

    }

  </style>
</head>

<body>

  <main class="portada">

    <h1>
      Esto es para vos, Melani 💕
    </h1>

    <button class="continuar">
      Empezar →
    </button>

  </main>

</body>
</html>
  </main>

</body>
</html>
