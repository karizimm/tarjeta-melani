<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Para Melani 💕</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Parisienne&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      background: #f7f0ea;
      color: #2b2527;
      font-family: "Cormorant Garamond", serif;
    }

    /* =========================
       PORTADA
       ========================= */

    .portada {
      min-height: 100vh;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      text-align: center;
      padding: 30px;

      background:
        radial-gradient(
          circle at 15% 20%,
          rgba(211, 153, 168, 0.20),
          transparent 30%
        ),
        radial-gradient(
          circle at 85% 80%,
          rgba(170, 104, 122, 0.13),
          transparent 30%
        ),
        #f7f0ea;
    }

    h1 {
      font-family: "Parisienne", cursive;

      font-size: clamp(48px, 11vw, 82px);

      font-weight: normal;

      line-height: 1.2;

      max-width: 900px;

      color: #2b2527;
    }

    .continuar {
      margin-top: 50px;

      border: 1px solid #a96d7c;

      background: transparent;

      color: #7d4657;

      padding: 12px 30px;

      border-radius: 30px;

      font-family: "Cormorant Garamond", serif;

      font-size: 16px;

      cursor: pointer;

      transition: all 0.3s ease;
    }

    .continuar:hover {
      background: #7d4657;
      color: white;
    }


    /* =========================
       PÁGINA 2
       ========================= */

    .recuerdos {
      min-height: 100vh;

      padding: 90px 25px;

      text-align: center;

      background: #fffaf7;
    }

    .titulo-recuerdos {
      font-family: "Parisienne", cursive;

      font-size: clamp(42px, 9vw, 68px);

      font-weight: normal;

      line-height: 1.2;

      color: #2b2527;

      max-width: 700px;

      margin: 0 auto 70px;
    }

    .inicio-recuerdos {
      max-width: 700px;

      margin: 0 auto;
    }

       .foto-recuerdo {
      display: block;

      width: 100%;
      max-width: 520px;

      height: auto;

      margin: 0 auto;

      border-radius: 4px;

      box-shadow:
        0 10px 30px rgba(80, 50, 60, 0.12);
    }

    .descripcion-recuerdo {
      max-width: 600px;

      margin: 30px auto 0;

      font-size: 21px;

      line-height: 1.6;

      color: #5f454d;

      font-style: italic;
    }

    @media (max-width: 600px) {

      .recuerdos {
        padding: 75px 20px;
      }

      .titulo-recuerdos {
        font-size: 46px;
      }

    }

  </style>
</head>

<body>

  <!-- =========================
       PORTADA
       ========================= -->

  <section class="portada">

    <h1>
      Esto es para vos, Melani 💕
    </h1>

    <a href="#recuerdos" class="continuar">
      Empezar →
    </a>

  </section>


  <!-- =========================
       PÁGINA 2
       ========================= -->

  <section class="recuerdos" id="recuerdos">

    <h2 class="titulo-recuerdos">
  Porque hay recuerdos que se quedan para siempre… ❤️
</h2>

    <div class="inicio-recuerdos">

  <img
    src="WhatsApp Image 2026-08-12 at 10.55.07.jpeg"
    alt="Una de nuestras primeras fotos"
    class="foto-recuerdo"
  >

  <p class="descripcion-recuerdo">
    Y pensar que esta foto fue el comienzo de tantas historias juntas.
  </p>

</div>

  </section>

</body>
</html>
