<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Melani...</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Parisienne&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;

      background:
        radial-gradient(
          circle at 20% 15%,
          rgba(191, 130, 148, 0.15),
          transparent 30%
        ),
        radial-gradient(
          circle at 85% 80%,
          rgba(150, 90, 110, 0.10),
          transparent 30%
        ),
        #f9f2ee;

      color: #2b2527;

      font-family: "Cormorant Garamond", serif;

      overflow-x: hidden;
    }


    /* =========================
       CONTENEDOR PRINCIPAL
       ========================= */

    .pagina {
      min-height: 100vh;

      padding: 70px 20px 100px;

      text-align: center;
    }


    /* =========================
       TÍTULO
       ========================= */

    .titulo {
      font-family: "Parisienne", cursive;

      font-size: clamp(55px, 12vw, 90px);

      font-weight: normal;

      line-height: 1;

      margin-bottom: 55px;

      color: #2b2527;
    }


    /* =========================
       FOTO
       ========================= */

    .foto-contenedor {
      display: inline-block;

      background: white;

      padding: 10px 10px 28px;

      box-shadow:
        0 15px 35px rgba(70, 40, 50, 0.18);

      transform: rotate(-2deg);

      margin-bottom: 55px;
    }

    .foto {
      width: 300px;

      max-width: 78vw;

      height: auto;

      display: block;
    }


    /* =========================
       FRASE TVD
       ========================= */

    .frase {
      max-width: 650px;

      margin: 0 auto;

      font-size: clamp(20px, 4vw, 27px);

      line-height: 1.45;

      font-style: italic;

      color: #4d3940;
    }


    /* =========================
       SEPARADOR
       ========================= */

    .separador {
      width: 45px;

      height: 1px;

      background: #a96d7c;

      margin: 75px auto 50px;

      position: relative;
    }

    .separador::after {
      content: "♥";

      position: absolute;

      left: 50%;

      top: 50%;

      transform: translate(-50%, -52%);

      background: #f9f2ee;

      padding: 0 10px;

      color: #a96d7c;

      font-size: 13px;
    }


    /* =========================
       DEDICATORIA
       ========================= */

    .dedicatoria {

      font-size: 19px;

      line-height: 1.45;

      font-style: italic;

      color: #604851;

      max-width: 330px;

      margin: 0 auto 25px;
    }


    /* =========================
       FLECHA
       ========================= */

    .flecha {

      display: block;

      font-size: 27px;

      color: #a96d7c;

      margin-bottom: 20px;

      animation: bajar 1.6s infinite ease-in-out;
    }

    @keyframes bajar {

      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(8px);
      }

    }


    /* =========================
       BOTÓN SPOTIFY
       ========================= */

    .spotify {

      display: inline-flex;

      align-items: center;

      gap: 10px;

      text-decoration: none;

      background: #2b2527;

      color: white;

      padding: 12px 25px;

      border-radius: 30px;

      font-family: "Cormorant Garamond", serif;

      font-size: 17px;

      transition: transform .25s ease;
    }

    .spotify:hover {
      transform: scale(1.04);
    }

    .play {
      font-size: 14px;
    }


    /* =========================
       CELULAR
       ========================= */

    @media (max-width: 600px) {

      .pagina {
        padding-top: 55px;
      }

      .titulo {
        font-size: 64px;

        margin-bottom: 45px;
      }

      .foto {
        width: 275px;
      }

      .frase {
        font-size: 20px;

        max-width: 330px;
      }

      .separador {
        margin-top: 65px;
      }

      .dedicatoria {
        font-size: 18px;
      }

    }

  </style>
</head>


<body>

  <main class="pagina">


    <!-- TÍTULO -->

    <h1 class="titulo">
      Melani...
    </h1>


    <!-- FOTO -->

    <div class="foto-contenedor">

      <img
        src="WhatsApp Image 2026-08-12 at 1.55.15 PM.jpeg"
        alt="Nosotras"
        class="foto"
      >

    </div>


    <!-- FRASE DE THE VAMPIRE DIARIES -->

    <p class="frase">
      “La pequeña posibilidad de tener una vida perfecta contigo
      es infinitamente mejor que una vida inmortal sin ti.”
    </p>


    <!-- SEPARADOR -->

    <div class="separador"></div>


    <!-- CANCIÓN -->

    <span class="flecha">
      ↓
    </span>

    <p class="dedicatoria">
      Y porque hay cosas que no sé cómo decirte…
      esta canción lo dice por mí. 🎶
    </p>


    <a
      class="spotify"
      href="https://open.spotify.com/track/4ybdTQiPB5RrbVgRMwlBNk"
      target="_blank"
      rel="noopener noreferrer"
    >
      <span class="play">▶</span>
      Escuchar
    </a>


  </main>

</body>
</html>
